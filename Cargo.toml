[package]
name = "easytier-stun"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Self-hosted STUN server interoperable with EasyTier"
license = "LGPL-3.0-only"

[dependencies]
anyhow = "1"
bytecodec = "0.4.15"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
stun_codec = "0.3.5"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = true
